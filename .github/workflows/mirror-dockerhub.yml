# Copies an already-published manifest list from GHCR to Docker Hub.
#
# The build workflow mirrors each release as it publishes, so this is only for
# tags that predate the Docker Hub setup, or one that a failed mirror step left
# behind. It copies the existing manifest rather than rebuilding, so it costs
# seconds instead of the hour a forced rebuild of every architecture would.

name: Mirror to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag already in GHCR, for example 3.35.4"
        required: true
      channel:
        description: "Channel alias to move"
        required: true
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

jobs:
  mirror:
    if: vars.DOCKERHUB_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the source image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/flutter" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the manifest list across
        env:
          REGISTRY_IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          tags=(--tag "${DOCKERHUB_REPO}:${TAG}"
                --tag "${DOCKERHUB_REPO}:${CHANNEL}")
          if [ "$CHANNEL" = "stable" ]; then
            tags+=(--tag "${DOCKERHUB_REPO}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${REGISTRY_IMAGE}:${TAG}"

      - name: Show what was published
        env:
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
          TAG: ${{ inputs.tag }}
        run: docker buildx imagetools inspect "${DOCKERHUB_REPO}:${TAG}"
