# Builds one Flutter version for both architectures and publishes it.
#
# Split into a reusable workflow so build.yml stays about *which* versions to
# build and this stays about *how*.
#
# Each architecture builds on its own native runner rather than under QEMU.
# This image runs `flutter precache` and an Android SDK layer, and emulating
# that for arm64 on an amd64 runner turns a ten-minute build into hours.
# Per-arch builds push by digest, then a merge job stitches them into one
# manifest list, which is the documented multi-platform pattern.
#
# Before anything is pushed, each build is loaded into the runner's local
# Docker daemon and smoke-tested against a throwaway Flutter project: `flutter
# create`, `flutter pub get`, and the Gradle wrapper on both architectures,
# plus a debug APK build on amd64. A build that only proves `flutter doctor`
# passes can still be unusable downstream -- that is exactly how #3 slipped
# through -- so this exercises the same Gradle wrapper / artifact-cache path a
# real consumer hits.

name: Build one version

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      image:
        description: "Fully qualified image name, already lowercased"
        required: true
        type: string
      push:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ${{ inputs.image }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: sdk
          platforms: ${{ matrix.platform }}
          build-args: flutter_version=${{ inputs.version }}
          # By digest, with no tag. The tags go on the manifest list below, so
          # a half-finished multi-arch build never leaves `stable` pointing at
          # one architecture.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          cache-from: type=gha,scope=${{ inputs.channel }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ inputs.channel }}-${{ matrix.slug }}

      # A separate build that loads into the local Docker daemon instead of
      # pushing. It reuses the cache the step above just populated, so this
      # is a cache hit, not a second real build.
      - name: Load the image for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: sdk
          platforms: ${{ matrix.platform }}
          build-args: flutter_version=${{ inputs.version }}
          load: true
          tags: smoke-test:${{ matrix.slug }}
          cache-from: type=gha,scope=${{ inputs.channel }}-${{ matrix.slug }}

      - name: Smoke test - pub get and the Gradle wrapper
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker run --rm -w /tmp "smoke-test:${{ matrix.slug }}" bash -lc '
            set -euo pipefail
            flutter create smoke
            cd smoke
            flutter pub get
            cd android && ./gradlew --version
          '

      # The Linux Android SDK build-tools and platform-tools are published as
      # x86_64 binaries only, so aapt2 and adb cannot run in the arm64 image
      # and an APK build there fails inside Gradle (see issue #12). pub get and
      # the wrapper above still cover the #3 regression on both arches.
      - name: Smoke test - debug APK build (amd64)
        if: matrix.slug == 'amd64'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          docker run --rm -w /tmp "smoke-test:${{ matrix.slug }}" bash -lc '
            set -euo pipefail
            flutter create smoke_apk
            cd smoke_apk
            flutter build apk --debug
          '

      - name: Export the digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The artifact filename is the bare digest; the merge job re-adds
          # the sha256: prefix. Expression syntax cannot strip it, so shell does.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ inputs.channel }}-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-${{ inputs.channel }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # The exact version, and the channel it is currently the head of.
          # `latest` follows stable, which is what an unqualified pull means.
          tags=(--tag "${REGISTRY_IMAGE}:${{ inputs.tag }}"
                --tag "${REGISTRY_IMAGE}:${{ inputs.channel }}")
          if [ "${{ inputs.channel }}" = "stable" ]; then
            tags+=(--tag "${REGISTRY_IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ inputs.tag }}"

  # Docker Hub is opt-in. With the secrets unset this is skipped, so a fork
  # publishing only to GHCR needs no configuration at all.
  mirror-dockerhub:
    needs: merge
    if: inputs.push && vars.DOCKERHUB_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the manifest list across
        run: |
          set -euo pipefail
          tags=(--tag "${{ vars.DOCKERHUB_REPO }}:${{ inputs.tag }}"
                --tag "${{ vars.DOCKERHUB_REPO }}:${{ inputs.channel }}")
          if [ "${{ inputs.channel }}" = "stable" ]; then
            tags+=(--tag "${{ vars.DOCKERHUB_REPO }}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${REGISTRY_IMAGE}:${{ inputs.tag }}"
