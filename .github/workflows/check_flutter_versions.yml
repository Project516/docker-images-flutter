name: "Check Flutter versions"
on:
  schedule:
    # 03:15 UTC daily, an hour ahead of the build workflow, so a new stable
    # shows up in the tracking PR the same morning it publishes.
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  check_versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get install -y jq curl

      - name: Check for new Flutter versions
        run: sh scripts/update_flutter_versions.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: Update Flutter version"
          title: "chore: Update Flutter version"
          branch: "chore/update-flutter-version"
          # GITHUB_TOKEN cannot trigger other workflows, so the gate and lint
          # checks never start and the PR sits blocked forever. A PAT passed
          # here triggers them normally.
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
