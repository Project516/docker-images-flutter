name: "Check Flutter versions"
on:
  schedule:
    # Every Monday at 04:15 UTC
    - cron: "15 4 * * 1"
  workflow_dispatch:

jobs:
  check_versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get install -y jq curl

      - name: Check for new Flutter versions
        run: sh scripts/update_flutter_versions.sh

      # Create a Pull Request if there are any changes.
      # This is automatically checked internally.
      #
      # The default GITHUB_TOKEN cannot trigger other workflows. If you want
      # version-update PRs to also trigger the build workflow, create a PAT
      # with repo scope and pass it here:
      #   token: ${{ secrets.BOT_PAT }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: Update Flutter version"
          title: "chore: Update Flutter version"
          branch: "chore/update-flutter-version"
